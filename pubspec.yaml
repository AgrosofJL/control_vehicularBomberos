name: checklist_vehicular
description: "Sistema de checklist vehicular para bomberos - AgroSoft J&L"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Conexión y utilidades
  supabase_flutter: ^2.8.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.2
  device_info_plus: ^10.1.2

  # Base de datos y rutas
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.3.4+4
  sqflite_common_ffi_web: ^0.4.5+1
  path: ^1.9.1

  # Documentos e impresión
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

# Configuración del generador de iconos
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F4F5F7"
  adaptive_icon_foreground: "assets/logo/logo.png"
  web:
    generate: true
    image_path: "assets/logo/logo.png"
    background_color: "#F4F5F7"
    theme_color: "#1E6B4C"
  windows:
    generate: true
    image_path: "assets/logo/logo.png"
    icon_size: 48

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/catalogo/
    - assets/icono.ico