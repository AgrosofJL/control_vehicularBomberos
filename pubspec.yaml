name: checklist_vehicular
description: "Sistema de checklist vehicular para bomberos - AgroSoft J&L"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # ==========================================
  # ACA ES LO NUEVO
  # ==========================================
  supabase_flutter: ^2.8.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  sqflite: ^2.4.2+1
  path: ^1.9.1
  pdf: ^3.12.0
  printing: ^5.14.3
  shared_preferences: ^2.2.2
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icono.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F5F5F7"
  adaptive_icon_foreground: "assets/icono.png"


flutter:
  uses-material-design: true
  assets:
    - assets/logo/  # El archivo SQLite que armás desde afuera con el DB Browser
    - assets/catalogo/